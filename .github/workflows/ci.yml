name: TEACHR CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check server/index.js
          node --check server/firebase-admin.js
          node --check server/usage-enforcement.js
          node --check ai-provider.js
          node --check output-formatting.js
          node --check generation-usage.js
          node --check usage-service.js
          node --check usage-ui.js
          node --check upgrade.js
          node --check teachr-auth.js
          node --check app-shell.js
          node --check tests/stage8-quota-matrix.test.js
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(p.version!=='1.1.0') process.exit(1); if(!p.scripts.start) process.exit(1)"
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f app-shell.js
          test -f ai-provider.js
          test -f output-formatting.js
          test -f generation-usage.js
          test -f usage-service.js
          test -f usage-ui.js
          test -f LOGO.png
          test -f server/index.js
          test -f server/.env.example
          grep -q "TEACHR" index.html
          grep -q "Lesson Builder" index.html
          grep -q "Worksheet" index.html
          grep -q "Assessment" index.html
          grep -q "/api/generate" app.js
          grep -q "teachrApp" app-shell.js
      - name: Validate generation usage model
        run: node tests/generation-usage.test.js
      - name: Validate frontend usage service
        run: node tests/usage-service.test.js
      - name: Validate generation usage UI
        run: node tests/usage-ui.test.js
      - name: Validate authenticated generation client
        run: node tests/generation-client.test.js
      - name: Validate Stage 7 upgrade experience
        run: node tests/upgrade-experience.test.js
      - name: Validate server usage enforcement
        run: node tests/usage-enforcement.test.js
      - name: Validate Stage 8 quota matrix
        run: node tests/stage8-quota-matrix.test.js
      - name: Validate Firestore usage rules
        run: node tests/firestore-usage-rules.test.js
      - name: Validate Pro subscription access
        run: node tests/pro-access.test.js
      - name: Run complete test suite
        run: npm test
