name: VLE shell check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'vle.html'
      - 'vle.js'
      - 'vle-auth.js'
      - 'vle.css'
      - 'tests/vle-shell.test.mjs'
      - '.github/workflows/vle-shell-check.yml'

permissions:
  contents: read

jobs:
  vle-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/vle-shell.test.mjs